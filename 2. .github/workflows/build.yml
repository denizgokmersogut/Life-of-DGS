name: Build Life of DGS APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip & Build Android Project
        run: |
          unzip -o Life-of-DGS-Proje-v3.zip
          npm install
          npx cap add android
          chmod +x setup_icons.sh && ./setup_icons.sh
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-of-DGS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
